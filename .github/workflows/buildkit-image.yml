# source  latest
# dest    stable-1
# result  docker/buildkit-syft-scanner:latest > docker/buildkit-syft-scanner:stable-1
#
# source  v1.0.0
# dest    stable-1
# result  docker/buildkit-syft-scanner:v1.0.0 > docker/buildkit-syft-scanner:stable-1
name: buildkit-image

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      source-tag:
        description: 'Source tag'
        required: true
        default: 'latest'
      dest-tag:
        description: 'Dest tag'
        required: true
        default: 'stable-1'
      push:
        description: 'Push the created manifest list to the registry'
        required: false
        type: boolean

env:
  DOCKERHUB_SLUG: docker/buildkit-syft-scanner

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read # same as global permission
      id-token: write # for logging in to Docker Hub with GitHub OIDC
    steps:
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      -
        name: Login to DockerHub
        if: ${{ inputs.push }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: docker
      -
        name: Create
        env:
          DRYRUN_FLAG: ${{ inputs.push == 'false' && '--dry-run' || '' }}
          DEST_TAG: ${{ inputs.dest-tag }}
          SOURCE_TAG: ${{ inputs.source-tag }}
        run: |
          set -x
          docker buildx imagetools create ${DRYRUN_FLAG} --tag \
            "${{ env.DOCKERHUB_SLUG }}:${DEST_TAG}" \
            "${{ env.DOCKERHUB_SLUG }}:${SOURCE_TAG}"
